name: Update Repository

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: update-repo-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # A `release` event runs on refs/tags/<tag>, so a plain checkout lands
          # on a detached HEAD at the tag and the commit below cannot be pushed.
          # Check out the default branch instead.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Update app-repo.json
        env:
          # Defaults to this repository. Set a `RELEASE_REPO` repository variable
          # (owner/name) to mirror releases published somewhere else.
          RELEASE_REPO: ${{ vars.RELEASE_REPO || github.repository }}
          # Authenticated calls are not rate limited to 60 requests/hour.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./update-repo.sh

      - name: Commit changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if git diff --quiet -- app-repo.json; then
            echo "app-repo.json is unchanged, nothing to commit."
            exit 0
          fi

          BRANCH="$(git symbolic-ref --short HEAD)"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-repo.json
          git commit -m 'chore: update repo'
          # Push explicitly rather than relying on upstream tracking being set.
          git push origin "HEAD:refs/heads/${BRANCH}"
